    <link rel="stylesheet" href="../../style.css">
    <style>
        body {
            background: #e8e4db;
        }
        .reader-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border: 2px solid #333;
            box-shadow: 8px 8px 0 #d9d0c1;
        }
        .reader-nav {
            text-align: center;
            margin-bottom: 30px;
        }
        .reader-nav a {
            font-family: 'Courier New', monospace;
            color: #ab3b3b;
            text-decoration: none;
            font-size: 14px;
        }
        h2.reader-title {
            text-align: center;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .reader-subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 40px;
        }

        /* Single page (cover) */
        .comic-page.single {
            text-align: center;
            margin-bottom: 40px;
        }
        .comic-page.single img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.05);
        }

        /* Spread: two pages side by side */
        .comic-page.spread {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .comic-page.spread img {
            width: calc(50% - 5px);
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.05);
            display: block;
        }
        @media (max-width: 600px) {
            .comic-page.spread img {
                width: 100%;
            }
        }
        .end-note {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
        }
    </style>
</head>
