<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCP-VAN-001: Vanitas (Complete) — Cat Corp</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        body {
            background: #e8e4db;
        }
        .reader-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border: 2px solid #333;
            box-shadow: 8px 8px 0 #d9d0c1;
        }
        .reader-nav {
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
        }
        .reader-nav a {
            color: #ab3b3b;
            text-decoration: none;
            font-size: 14px;
        }
        .reader-toolbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .reader-toolbar button {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 6px 12px;
            background: #fdfaf4;
            border: 1px solid #999;
            cursor: pointer;
            box-shadow: 2px 2px 0 #ccc;
            transition: background 0.2s;
        }
        .reader-toolbar button.active {
            background: #f0ece1;
            box-shadow: 1px 1px 0 #bbb;
            border-color: #ab3b3b;
            color: #ab3b3b;
            font-weight: bold;
        }

        /* Spread view – container for current page(s) */
        .spread-view {
            text-align: center;
        }
        .spread-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
        }
        /* Desktop: two-page spread images side by side */
        .spread-container img {
            width: calc(50% - 5px);
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.05);
            display: block;
        }
        /* Single-image containers (cover on desktop, or any page on mobile) */
        .spread-container.single-image img {
            width: auto;
            max-width: 70%;
        }
        .arrow-nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }
        .arrow-nav button {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            padding: 8px 16px;
            background: #fdfaf4;
            border: 1px solid #555;
            cursor: pointer;
            box-shadow: 3px 3px 0 #ccc;
            transition: background 0.2s;
        }
        .arrow-nav button:disabled {
            opacity: 0.4;
            cursor: default;
            box-shadow: none;
        }
        .page-indicator {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #777;
            margin-top: 10px;
        }

        /* Scroll view – always single pages stacked vertically */
        .scroll-view {
            text-align: center;
        }
        .scroll-page {
            margin-bottom: 30px;
        }
        .scroll-page img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.05);
            display: inline-block;
        }
        .end-note {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
        }

        /* On mobile, single-image mode already shows full width; no extra stacking needed */
    </style>
</head>
<body>
    <div class="reader-container">
        <div class="reader-nav">
            <a href="../series/vanitas.html">← Return to Vanitas</a>
        </div>

        <h2 style="text-align:center; font-weight:normal; letter-spacing:2px;">Vanitas</h2>
        <p style="text-align:center; color:#666; font-size:14px; margin-bottom:20px;">Complete Work — Declassified</p>

        <div class="reader-toolbar">
            <button id="btn-spread" class="active">📖 Spreads (Page Flip)</button>
            <button id="btn-scroll">📜 Scroll View</button>
        </div>

        <!-- Spread view (default) -->
        <div id="spread-view" class="spread-view">
            <div id="spread-display" class="spread-container"></div>
            <div class="arrow-nav">
                <button id="prev-spread">◀ Previous</button>
                <button id="next-spread">Next ▶</button>
            </div>
            <div class="page-indicator" id="spread-indicator"></div>
        </div>

        <!-- Scroll view (hidden initially) -->
        <div id="scroll-view" class="scroll-view" style="display:none;"></div>

        <div class="end-note">
            End of declassified document. — Cat Corp Archives
        </div>
    </div>

    <script>
        (function() {
            const imageBase = "../../images/vanitas/";

            // All 19 page filenames in order
            const allPages = Array.from({ length: 19 }, (_, i) => {
                const num = String(i + 1).padStart(3, '0');
                return `vanitas-${num}.jpg`;
            });

            // Desktop spreads: cover alone, then pairs
            const desktopSpreads = [
                [allPages[0]],
                [allPages[1], allPages[2]],
                [allPages[3], allPages[4]],
                [allPages[5], allPages[6]],
                [allPages[7], allPages[8]],
                [allPages[9], allPages[10]],
                [allPages[11], allPages[12]],
                [allPages[13], allPages[14]],
                [allPages[15], allPages[16]],
                [allPages[17], allPages[18]]
            ];

            // Mobile single‑page “spreads” – each entry is an array of one image
            const mobilePages = allPages.map(p => [p]);

            // Viewport detection
            const mobileQuery = window.matchMedia('(max-width: 600px)');
            let isMobile = mobileQuery.matches;

            // Current indices
            let currentSpreadIdx = 0;   // for desktop spreads
            let currentPageIdx = 0;     // for mobile single pages

            // DOM elements
            const spreadView = document.getElementById("spread-view");
            const scrollView = document.getElementById("scroll-view");
            const spreadDisplay = document.getElementById("spread-display");
            const prevBtn = document.getElementById("prev-spread");
            const nextBtn = document.getElementById("next-spread");
            const indicator = document.getElementById("spread-indicator");
            const btnSpread = document.getElementById("btn-spread");
            const btnScroll = document.getElementById("btn-scroll");

            // Get the correct dataset and index for the current viewport
            function getCurrentData() {
                if (isMobile) {
                    return { dataset: mobilePages, idx: currentPageIdx, total: mobilePages.length, label: 'Page' };
                } else {
                    return { dataset: desktopSpreads, idx: currentSpreadIdx, total: desktopSpreads.length, label: 'Spread' };
                }
            }

            // Convert indices when switching between mobile/desktop
            function syncIndices(mobilenow) {
                if (mobilenow) {
                    // converting from desktop spread index to mobile page index
                    if (currentSpreadIdx === 0) {
                        currentPageIdx = 0;
                    } else {
                        currentPageIdx = 2 * currentSpreadIdx - 1;  // first page of that spread
                    }
                } else {
                    // converting from mobile page index to desktop spread index
                    if (currentPageIdx === 0) {
                        currentSpreadIdx = 0;
                    } else {
                        currentSpreadIdx = Math.floor((currentPageIdx + 1) / 2);
                    }
                }
            }

            // Render the current page/spread
            function render() {
                const { dataset, idx, total, label } = getCurrentData();
                const images = dataset[idx];
                const isSingle = images.length === 1;

                // Build HTML
                let containerClass = 'spread-container';
                if (isSingle) containerClass += ' single-image';

                let html = `<div class="${containerClass}">`;
                images.forEach((src, i) => {
                    html += `<img src="${imageBase}${src}" alt="Page">`;
                });
                html += `</div>`;
                spreadDisplay.innerHTML = html;

                // Update navigation
                prevBtn.disabled = (idx === 0);
                nextBtn.disabled = (idx === total - 1);
                indicator.textContent = `${label} ${idx + 1} of ${total}`;
            }

            // Arrow button handlers – operate on the current active index
            prevBtn.addEventListener('click', () => {
                if (isMobile) {
                    if (currentPageIdx > 0) { currentPageIdx--; }
                } else {
                    if (currentSpreadIdx > 0) { currentSpreadIdx--; }
                }
                render();
            });

            nextBtn.addEventListener('click', () => {
                if (isMobile) {
                    if (currentPageIdx < mobilePages.length - 1) { currentPageIdx++; }
                } else {
                    if (currentSpreadIdx < desktopSpreads.length - 1) { currentSpreadIdx++; }
                }
                render();
            });

            // Switch between Spread and Scroll views
            btnSpread.addEventListener('click', () => {
                spreadView.style.display = 'block';
                scrollView.style.display = 'none';
                btnSpread.classList.add('active');
                btnScroll.classList.remove('active');
                render();
            });

            btnScroll.addEventListener('click', () => {
                spreadView.style.display = 'none';
                scrollView.style.display = 'block';
                btnScroll.classList.add('active');
                btnSpread.classList.remove('active');
                // Build scroll view if empty (once)
                if (scrollView.children.length === 0) {
                    let html = '';
                    allPages.forEach(src => {
                        html += `<div class="scroll-page"><img src="${imageBase}${src}" alt="Page"></div>`;
                    });
                    scrollView.innerHTML = html;
                }
            });

            // Viewport change handler
            mobileQuery.addEventListener('change', (e) => {
                const newIsMobile = e.matches;
                if (newIsMobile !== isMobile) {
                    syncIndices(newIsMobile);   // convert current index before switching
                    isMobile = newIsMobile;
                    render();
                }
            });

            // Initial render
            // Ensure indices are consistent with initial viewport
            // (on load they are both 0 so no conversion needed)
            render();
        })();
    </script>
</body>
</html>
