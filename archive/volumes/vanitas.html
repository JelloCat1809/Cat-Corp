<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCP-VAN-001: Vanitas (Complete) — Cat Corp</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        body {
            background: #e8e4db;
        }
        .reader-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border: 2px solid #333;
            box-shadow: 8px 8px 0 #d9d0c1;
        }
        .reader-nav {
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
        }
        .reader-nav a {
            color: #ab3b3b;
            text-decoration: none;
            font-size: 14px;
        }
        .reader-toolbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .reader-toolbar button {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 6px 12px;
            background: #fdfaf4;
            border: 1px solid #999;
            cursor: pointer;
            box-shadow: 2px 2px 0 #ccc;
            transition: background 0.2s;
        }
        .reader-toolbar button.active {
            background: #f0ece1;
            box-shadow: 1px 1px 0 #bbb;
            border-color: #ab3b3b;
            color: #ab3b3b;
            font-weight: bold;
        }

        /* Spread view */
        .spread-view {
            text-align: center;
        }
        .spread-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;   /* aligned top edge */
            gap: 10px;
            margin: 20px 0;
            /* NO flex-wrap – always side‑by‑side */
        }
        .spread-container img {
            width: calc(50% - 5px);    /* each takes half minus gap */
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.05);
            display: block;
        }
        .spread-container.single-cover img {
            width: auto;
            max-width: 70%;
        }
        .arrow-nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }
        .arrow-nav button {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            padding: 8px 16px;
            background: #fdfaf4;
            border: 1px solid #555;
            cursor: pointer;
            box-shadow: 3px 3px 0 #ccc;
            transition: background 0.2s;
        }
        .arrow-nav button:disabled {
            opacity: 0.4;
            cursor: default;
            box-shadow: none;
        }
        .page-indicator {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #777;
            margin-top: 10px;
        }

        /* Scroll view */
        .scroll-view {
            text-align: center;
        }
        .scroll-spread {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 30px;
            /* also no wrap for horizontal pairing */
        }
        .scroll-spread img {
            width: calc(50% - 5px);
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.05);
        }
        .scroll-spread.single-cover img {
            width: auto;
            max-width: 70%;
        }
        .end-note {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
        }

        /* On very narrow screens (optional) we could revert to vertical,
           but for now we keep horizontally side‑by‑side */
    </style>
</head>
<body>
    <div class="reader-container">
        <div class="reader-nav">
            <a href="../series/vanitas.html">← Return to Vanitas</a>
        </div>

        <h2 style="text-align:center; font-weight:normal; letter-spacing:2px;">Vanitas</h2>
        <p style="text-align:center; color:#666; font-size:14px; margin-bottom:20px;">Complete Work — Declassified</p>

        <div class="reader-toolbar">
            <button id="btn-spread" class="active">📖 Spreads (Page Flip)</button>
            <button id="btn-scroll">📜 Scroll View</button>
        </div>

        <!-- Spread view (default) -->
        <div id="spread-view" class="spread-view">
            <div id="spread-display" class="spread-container"></div>
            <div class="arrow-nav">
                <button id="prev-spread">◀ Previous</button>
                <button id="next-spread">Next ▶</button>
            </div>
            <div class="page-indicator" id="spread-indicator"></div>
        </div>

        <!-- Scroll view (hidden initially) -->
        <div id="scroll-view" class="scroll-view" style="display:none;">
            <!-- filled by JS -->
        </div>

        <div class="end-note">
            End of declassified document. — Cat Corp Archives
        </div>
    </div>

    <script>
        (function() {
            const imageBase = "../../images/vanitas/";
            const spreads = [
                ["vanitas-001.jpg"],                     // cover
                ["vanitas-002.jpg", "vanitas-003.jpg"],
                ["vanitas-004.jpg", "vanitas-005.jpg"],
                ["vanitas-006.jpg", "vanitas-007.jpg"],
                ["vanitas-008.jpg", "vanitas-009.jpg"],
                ["vanitas-010.jpg", "vanitas-011.jpg"],
                ["vanitas-012.jpg", "vanitas-013.jpg"],
                ["vanitas-014.jpg", "vanitas-015.jpg"],
                ["vanitas-016.jpg", "vanitas-017.jpg"],
                ["vanitas-018.jpg", "vanitas-019.jpg"]
            ];

            let currentSpread = 0;

            const spreadView    = document.getElementById("spread-view");
            const scrollView    = document.getElementById("scroll-view");
            const spreadDisplay = document.getElementById("spread-display");
            const prevBtn       = document.getElementById("prev-spread");
            const nextBtn       = document.getElementById("next-spread");
            const indicator     = document.getElementById("spread-indicator");
            const btnSpread     = document.getElementById("btn-spread");
            const btnScroll     = document.getElementById("btn-scroll");

            function renderSpread() {
                const images = spreads[currentSpread];
                let html = '';
                if (images.length === 1) {
                    html = `<div class="spread-container single-cover">
                                <img src="${imageBase}${images[0]}" alt="Page">
                            </div>`;
                } else {
                    html = `<div class="spread-container">
                                <img src="${imageBase}${images[0]}" alt="Left page">
                                <img src="${imageBase}${images[1]}" alt="Right page">
                            </div>`;
                }
                spreadDisplay.innerHTML = html;
                prevBtn.disabled = (currentSpread === 0);
                nextBtn.disabled = (currentSpread === spreads.length - 1);
                indicator.textContent = `Spread ${currentSpread + 1} of ${spreads.length}`;
            }

            prevBtn.addEventListener("click", () => {
                if (currentSpread > 0) {
                    currentSpread--;
                    renderSpread();
                }
            });
            nextBtn.addEventListener("click", () => {
                if (currentSpread < spreads.length - 1) {
                    currentSpread++;
                    renderSpread();
                }
            });

            // Mode switching
            btnSpread.addEventListener("click", () => {
                spreadView.style.display = "block";
                scrollView.style.display = "none";
                btnSpread.classList.add("active");
                btnScroll.classList.remove("active");
                renderSpread();
            });

            btnScroll.addEventListener("click", () => {
                spreadView.style.display = "none";
                scrollView.style.display = "block";
                btnScroll.classList.add("active");
                btnSpread.classList.remove("active");
                if (scrollView.children.length === 0) {
                    buildScrollView();
                }
            });

            function buildScrollView() {
                let html = '';
                for (let i = 0; i < spreads.length; i++) {
                    const images = spreads[i];
                    if (images.length === 1) {
                        html += `<div class="scroll-spread single-cover">
                                    <img src="${imageBase}${images[0]}" alt="Page">
                                </div>`;
                    } else {
                        html += `<div class="scroll-spread">
                                    <img src="${imageBase}${images[0]}" alt="Page">
                                    <img src="${imageBase}${images[1]}" alt="Page">
                                </div>`;
                    }
                }
                scrollView.innerHTML = html;
            }

            renderSpread();   // initial load
        })();
    </script>
</body>
</html>
